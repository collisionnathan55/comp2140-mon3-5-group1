            flex-direction: row;
            justify-content: space-between;
        }
        #home-page-instagram > small > button {
            border-radius: 0;
            background-color: transparent;
            color: black;
            font-size: larger;
        }

        @media (max-width: 768px) {
            #home-page-instagram {

            image.src = instagram_images[currentImg];
